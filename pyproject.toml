[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-transcriber"
version = "0.0.1"
description = "Commercially usable lead-sheet AMT (Apache/MIT stack) for Copyist"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Digital Defiance" }]
dependencies = []

[project.optional-dependencies]
dev = []
# T0 extras will pin MT3 / Omnizart / torch when baselines land.
baseline = []

[project.urls]
Homepage = "https://github.com/Digital-Defiance/open-transcriber"
Copyist = "https://github.com/Digital-Defiance/copyist"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_transcriber*"]
