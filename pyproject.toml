[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-transcriber"
version = "0.0.1"
description = "Commercially usable lead-sheet AMT (Apache/MIT stack) for Copyist"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Digital Defiance" }]
dependencies = []

[project.optional-dependencies]
dev = []
# T0: Spotify Basic Pitch (Apache-2.0) via CoreML on macOS.
# On Python 3.12+, pip's basic-pitch meta-dep wants tensorflow-macos which is
# unpublished for that range — install with the script in README ( --no-deps ).
baseline = [
    "basic-pitch>=0.4.0",
    "mir-eval>=0.6",
    "pretty-midi>=0.2.9",
    "resampy>=0.2.2,<0.4.3",
    "coremltools; platform_system == 'Darwin'",
    "setuptools<81",
]

[project.urls]
Homepage = "https://github.com/Digital-Defiance/open-transcriber"
Copyist = "https://github.com/Digital-Defiance/copyist"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_transcriber*"]
